# =============================================================================
# CStyleCheck — CI gate profile
# =============================================================================
# Used in pull-request and commit CI checks.  Only clear structural errors
# fail the build (non-zero exit); warnings and info are reported but ignored
# by the CI pass/fail decision.
#
# Do NOT pass --exit-zero in CI — let the checker's exit code gate the PR.
# =============================================================================

file_prefix:
  enabled: false

variables:
  enabled: true
  severity: warning
  case: lower_snake
  min_length: 2
  max_length: 31
  allow_single_char_loop_vars: true
  allow_loop_vars_short: true

  global:
    severity: warning
    case: lower_snake
    require_module_prefix: false
    g_prefix:
      enabled: false

  static:
    severity: warning
    case: lower_snake
    require_module_prefix: false
    s_prefix:
      enabled: false

  local:
    severity: info
    case: lower_snake

  parameter:
    severity: info
    case: lower_snake
    p_prefix:
      enabled: false

  pointer_prefix:
    enabled: false
  pp_prefix:
    enabled: false
  bool_prefix:
    enabled: false
  handle_prefix:
    enabled: false
  no_numeric_in_name:
    enabled: false
  prefix_order:
    enabled: false

functions:
  enabled: true
  severity: warning
  case: lower_snake
  require_module_prefix: false
  style: "any"
  max_parameters: 8
  max_lines: 75
  function_doc_header:
    enabled: false
  assert_density:
    enabled: false
  null_statement_comment:
    enabled: false
  declaration_spacing:
    enabled: false

constants:
  enabled: true
  severity: warning
  case: upper_snake
  require_prefix: false

typedefs:
  enabled: true
  severity: info
  case: "any"

enums:
  enabled: true
  severity: info
  members:
    case: upper_snake
    require_prefix: false

structs:
  enabled: true
  severity: info

include_guards:
  enabled: true
  severity: error         # Missing include guards → hard error in CI.

misc:
  copyright_header:
    enabled: false

  eof_comment:
    enabled: false

  line_length:
    enabled: true
    severity: warning
    max_length: 100

  indentation:
    enabled: true
    severity: error       # Indentation errors → hard error in CI.
    style: spaces
    spaces: 4

  magic_number:
    enabled: false

  unsigned_suffix:
    enabled: true
    severity: warning

  lowercase_l_suffix:
    enabled: true
    severity: error       # Ambiguous 'l' suffix → hard error in CI.

  yoda_condition:
    enabled: true
    severity: info

  block_comment_spacing:
    enabled: false

  comment_ratio:
    enabled: true
    severity: info
    min_ratio: 0.05
    max_ratio: 0.80
    exclude_doxygen: true

  whitespace_ratio:
    enabled: false

  declared_not_defined:
    enabled: false

  function_length:
    enabled: true
    severity: warning
    max_lines: 75

  function_doc_header:
    enabled: false
  assert_density:
    enabled: false
  null_statement_comment:
    enabled: false
  declaration_spacing:
    enabled: false

  file_length:
    enabled: true
    severity: warning
    max_lines: 400

  reserved_header_name:
    enabled: true
    severity: warning

  non_ascii_source:
    enabled: true
    severity: error       # Non-ASCII source → hard error in CI.

  octal_constant:
    enabled: true
    severity: error       # Octal constants → hard error in CI.

  trigraph:
    enabled: true
    severity: error

  constant_comparison:
    enabled: true
    severity: info
